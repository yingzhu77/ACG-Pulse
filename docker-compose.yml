services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: game-pulse
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/server/data/prod.db
      - PORT=3001
      - CLIENT_URL=${CLIENT_URL:?请设置 CLIENT_URL 为公开 HTTPS 地址}
      - TRUST_PROXY_HOPS=1
      - RSSHUB_BASE_URLS=${RSSHUB_BASE_URLS:-http://rsshub:1200,https://rsshub.app}
      - RSS_FETCH_TIMEOUT_MS=30000
      - SOURCE_CHECK_TIMEOUT_MS=35000
      - SOURCE_PREVIEW_TIMEOUT_MS=${SOURCE_PREVIEW_TIMEOUT_MS:-30000}
      - SOURCE_CHECK_CONCURRENCY=5
      - MAX_FEED_ITEMS=${MAX_FEED_ITEMS:-2000}
      - HEALTH_LOG_RETENTION_DAYS=${HEALTH_LOG_RETENTION_DAYS:-30}
      - ANALYSIS_TASK_COMPLETED_RETENTION_DAYS=${ANALYSIS_TASK_COMPLETED_RETENTION_DAYS:-14}
      - ANALYSIS_TASK_FAILED_RETENTION_DAYS=${ANALYSIS_TASK_FAILED_RETENTION_DAYS:-30}
      - STATS_CACHE_TTL_MS=${STATS_CACHE_TTL_MS:-30000}
      - API_METRICS_WINDOW_MS=${API_METRICS_WINDOW_MS:-900000}
      - API_METRICS_SAMPLE_LIMIT=${API_METRICS_SAMPLE_LIMIT:-2000}
      - API_SLOW_REQUEST_MS=${API_SLOW_REQUEST_MS:-500}
      - API_CRITICAL_REQUEST_MS=${API_CRITICAL_REQUEST_MS:-1500}
      # B站主路径是自建 RSSHub；直连只在显式开启时使用。
      - BILIBILI_DIRECT_API_FALLBACK=${BILIBILI_DIRECT_API_FALLBACK:-false}
      - BILIBILI_DIRECT_API_TIMEOUT_MS=30000
      - BILIBILI_REQUEST_INTERVAL_MS=6000
      # AI Provider - production default is DeepSeek
      - AI_PROVIDER=${AI_PROVIDER:-deepseek}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-deepseek/deepseek-v3.2}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-v4-flash}
      - MIMO_API_KEY=${MIMO_API_KEY:-}
      - MIMO_BASE_URL=${MIMO_BASE_URL:-https://token-plan-cn.xiaomimimo.com/v1}
      - MIMO_MODEL=${MIMO_MODEL:-mimo-v2.5}
      - REPORT_TIMEZONE=${REPORT_TIMEZONE:-Asia/Shanghai}
      # Admin - MUST be set before deployment
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?请设置 ADMIN_PASSWORD 环境变量}
      - ADMIN_JWT_SECRET=${ADMIN_JWT_SECRET:?请设置 ADMIN_JWT_SECRET 环境变量（至少32字符）}
    volumes:
      - app-data:/app/server/data
    depends_on:
      rsshub:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  rsshub:
    build:
      context: ./rsshub
      dockerfile: Dockerfile
    container_name: game-pulse-rsshub
    restart: unless-stopped
    expose:
      - "1200"
    environment:
      - NODE_ENV=production
      - CACHE_EXPIRE=600
      - REQUEST_TIMEOUT=15000
      - REQUEST_RETRY=2
      - BILIBILI_DM_IMG_LIST=${BILIBILI_DM_IMG_LIST:-}
      # RSSHub 只识别 per-uid 变量名；这里把同一登录 Cookie 映射到所有监控 UID。
      # 需要多账号时，把对应行改成各自的 BILIBILI_COOKIE_<uid>。
      - BILIBILI_COOKIE_401742377=${BILIBILI_COOKIE}
      - BILIBILI_COOKIE_1340190821=${BILIBILI_COOKIE}
      - BILIBILI_COOKIE_27534330=${BILIBILI_COOKIE}
      - BILIBILI_COOKIE_1636034895=${BILIBILI_COOKIE}
      - BILIBILI_COOKIE_1955897084=${BILIBILI_COOKIE}
      - BILIBILI_COOKIE_161775300=${BILIBILI_COOKIE}
      - BILIBILI_COOKIE_1265652806=${BILIBILI_COOKIE}
      - BILIBILI_COOKIE_3546636978489848=${BILIBILI_COOKIE}
      - BILIBILI_COOKIE_652239032=${BILIBILI_COOKIE}
      - BILIBILI_COOKIE_8465957=${BILIBILI_COOKIE}
      - BILIBILI_COOKIE_224267770=${BILIBILI_COOKIE}
      - BILIBILI_COOKIE_15319615=${BILIBILI_COOKIE}
    volumes:
      - rsshub-cache:/app/cache
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:1200/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  app-data:
    driver: local
  rsshub-cache:
    driver: local
